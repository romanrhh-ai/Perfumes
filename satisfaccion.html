<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Satisfacción | AURA PERFUMES</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #faf7f5; color: #333; }
        header { background-color: #241b1f; color: white; padding: 15px 7%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .logo { font-size: 26px; font-weight: bold; color: #e8b4b8; text-decoration: none; }
        nav { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .nav-item { position: relative; }
        nav a { color: white; text-decoration: none; font-weight: bold; font-size: 14px; display: inline-block; padding: 5px 0; }
        nav a:hover { color: #e8b4b8; }
        .dropdown-content { display: none; position: absolute; background-color: #241b1f; min-width: 170px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); z-index: 1; border-radius: 6px; overflow: hidden; top: 100%; left: 0; }
        .dropdown-content a { color: white; padding: 12px 16px; display: block; text-align: left; font-size: 13px; }
        .dropdown-content a:hover { background-color: #b76e79; }
        .nav-item:hover .dropdown-content { display: block; }
        .carrito-nav { background-color: #b76e79; padding: 7px 14px; border-radius: 8px; display: flex; align-items: center; gap: 6px; }

        section { padding: 50px 8%; max-width: 700px; margin: auto; }
        h2 { color: #9b5360; font-size: 34px; margin-bottom: 25px; text-align: center; }
        
        .formulario { background-color: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .formulario label { display: block; margin-top: 18px; margin-bottom: 7px; font-weight: bold; color: #4b3036; }
        .formulario input, .formulario select, .formulario textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 7px; font-size: 15px; }
        .formulario textarea { height: 110px; resize: none; }
        .formulario button { margin-top: 25px; width: 100%; padding: 13px; border: none; border-radius: 7px; background-color: #b76e79; color: white; font-weight: bold; cursor: pointer; font-size: 16px; }
        .formulario button:hover { background-color: #963f4d; }
        .volver { display: block; text-align: center; margin-top: 20px; color: #9b5360; text-decoration: none; font-weight: bold; }
        .volver:hover { text-decoration: underline; }

        footer { background-color: #241b1f; color: #ccc; text-align: center; padding: 35px; margin-top: 50px; }
    </style>
</head>
<body>
<header>
    <div class="logo-container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTUKORmsyYs-vOr6K0FE69wDL5dQiDMDjs9NY1Xf3ZdF7YlFs4NV6fDODQ&s=10" alt="Logo" class="logo-img">
        <a href="index.html" class="logo">AURA PERFUMES</a>
    </div>
    <nav>
        <a href="index.html">Inicio</a>
        <div class="nav-item">
            <a href="productos.html">Perfumes ▾</a>
            <div class="dropdown-content">
                <a href="productos.html?cat=hombre">Hombre</a>
                <a href="productos.html?cat=mujer">Mujer</a>
                <a href="productos.html?cat=unisex">Unisex</a>
            </div>
        </div>
        <div class="nav-item">
            <a href="contacto.html">Contacto ▾</a>
            <div class="dropdown-content">
                <a href="satisfaccion.html">Satisfacción al cliente</a>
            </div>
        </div>
        <a href="proposito.html">Propósito</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="carrito.html" class="carrito-nav">🛒 Carrito</a>
    </nav>
</header>
<main>
    <section>
        <h2>Encuesta de Satisfacción al Cliente</h2>
        
        <form class="formulario" onsubmit="event.preventDefault(); alert('¡Muchas gracias por contestar nuestra encuesta! Tus respuestas nos ayudan a mejorar.'); window.location.href='contacto.html';">
            <label>Nombre completo</label>
            <input type="text" placeholder="Escribe tu nombre" required>

            <label>Correo electrónico</label>
            <input type="email" placeholder="correo@ejemplo.com" required>

            <label>¿Cómo calificarías nuestra atención y servicio?</label>
            <select required>
                <option value="">Selecciona una opción</option>
                <option value="Excelente">Excelente</option>
                <option value="Bueno">Bueno</option>
                <option value="Regular">Regular</option>
                <option value="Malo">Malo</option>
            </select>

            <label>¿Qué te pareció la calidad de nuestros perfumes?</label>
            <select required>
                <option value="">Selecciona una opción</option>
                <option value="Superaron expectativas">Superaron mis expectativas</option>
                <option value="Muy buenos">Muy buenos</option>
                <option value="Normales">Normales</option>
                <option value="Por mejorar">Por mejorar</option>
            </select>

            <label>Comentarios o sugerencias adicionales</label>
            <textarea placeholder="Cuéntanos tu experiencia..."></textarea>

            <button type="submit">ENVIAR ENCUESTA</button>
        </form>
        
        <a href="contacto.html" class="volver">← Regresar a Contacto</a>
    </section>
</main>
<footer>
    <p>© 2026 <strong>AURA PERFUMES</strong></p>
</footer>
</body>
</html>
